[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omnipath-engine"
version = "0.1.0"
description = "Analytical serving engine over the OmniPath resource Parquet tables"
authors = [{ name = "OmniPath Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "omnipath-core>=0.1.0,<0.2.0",
    "duckdb>=1.5,<2",
    "pyarrow>=14.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["omnipath_engine*"]

[tool.uv.sources]
omnipath-core = { workspace = true }
