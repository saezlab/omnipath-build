[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omnipath-client"
version = "0.1.0"
description = "Install versioned OmniPath Parquet resources and query them locally"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "omnipath-engine>=0.1.0,<0.2.0",
    "duckdb>=1.5,<2",
    "httpx>=0.27,<1",
    "platformdirs>=3",
]

[project.optional-dependencies]
pandas = ["pandas>=2"]
test = ["pytest>=8"]

[project.scripts]
omnipath-client = "omnipath_client.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["omnipath_client*"]

[tool.setuptools.package-data]
omnipath_client = ["py.typed"]

[tool.uv.sources]
omnipath-engine = { workspace = true }
