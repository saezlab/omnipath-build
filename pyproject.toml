[tool.uv.workspace]
members = [
    "packages/omnipath_core",
    "packages/omnipath_resolver",
    "packages/omnipath_build",
    "packages/omnipath_postgres",
]

[tool.uv.sources]
omnipath-core = { workspace = true }
omnipath-resolver = { workspace = true }
omnipath-build = { workspace = true }
omnipath-postgres = { workspace = true }
pypath-omnipath = { path = "pypath", editable = true }
cachedir = { path = "cache-manager", editable = true }
dlmachine = { path = "download-manager", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff==0.11.13",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["legacy", "data", "logs", "pypath_log", "pypath-data", "**/build/**", "**/target/**"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
markers = ["integration: requires an explicitly configured local dataset or external service"]
testpaths = [
    "packages/omnipath_core/tests",
    "packages/omnipath_build/tests",
    "packages/omnipath_postgres/tests",
]
